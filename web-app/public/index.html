<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen3-TTS Tester</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 50px; background: #f4f4f9; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        .field { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        textarea, select, input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:disabled { background: #ccc; }
        audio { width: 100%; margin-top: 1.5rem; }
        .status { margin-top: 1rem; font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Qwen3-TTS Tester</h2>
        <div class="field">
            <label for="voiceSelect">Voce</label>
            <select id="voiceSelect" title="Seleziona la voce">
                <option value="default">Default</option>
                <option value="alloy">Alloy</option>
                <option value="echo">Echo</option>
                <option value="nova">Nova</option>
            </select>
        </div>
        <div class="field">
            <label for="textInput">Testo da sintetizzare</label>
            <textarea id="textInput" rows="4" placeholder="Inserisci il testo qui...">Ciao, come stai?</textarea>
        </div>
        <button id="generateBtn">Genera Audio</button>
        <div id="status" class="status"></div>
        <audio id="audioPlayer" controls></audio>
    </div>
    <script src="script.js"></script>
</body>
</html>
